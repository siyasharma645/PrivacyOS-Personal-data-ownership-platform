name: PrivacyOS CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: privacyos_test
          POSTGRES_USER: privacyos
          POSTGRES_PASSWORD: privacyos_secret
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      - name: Build & Test
        working-directory: backend
        run: mvn clean verify -DskipTests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/privacyos_test
          SPRING_DATASOURCE_USERNAME: privacyos
          SPRING_DATASOURCE_PASSWORD: privacyos_secret

  flutter:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.16.5', channel: 'stable' }
      - name: Get dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos || true
      - name: Build web
        working-directory: frontend
        run: flutter build web --release --dart-define=API_URL=http://localhost:8080
