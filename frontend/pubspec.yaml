name: privacyos
description: Personal Data Ownership & Privacy Intelligence Platform
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^12.1.3

  # Charts
  fl_chart: ^0.66.2

  # Graph visualization
  graphview: ^1.2.0

  # UI
  google_fonts: ^6.1.0
  lucide_icons: ^0.0.3
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.3.0
  lottie: ^3.0.0

  # Storage
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0

  # Utils
  intl: ^0.18.1
  timeago: ^3.6.0
  url_launcher: ^6.2.2

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
  assets:
    - assets/images/
    - assets/lottie/
